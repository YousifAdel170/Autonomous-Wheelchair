global_costmap:
  global_frame: map
  robot_base_frame: chassis
  update_frequency: 1.0
  publish_frequency: 0.5 
  static_map: true
  transform_tolerance: 0.5
  cost_scaling_factor: 5
  inflation_radius: 0.5  # Adjust as needed based on the size of obstacles and robot dimensions
  obstacle_range: 2.5  # Maximum range (in meters) at which obstacles are considered
